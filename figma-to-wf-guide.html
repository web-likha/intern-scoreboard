<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figma → Webflow Intern Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --card-bg: #1a1a2e;
    --card-border: rgba(255,255,255,0.07);
    --surface: #22223a;
    --pink:   #FF6B9D;
    --blue:   #4D96FF;
    --green:  #6BCB77;
    --yellow: #FFD93D;
    --purple: #C77DFF;
    --orange: #FF9A3C;
    --text:   #f0eeff;
    --muted:  #9090b0;
    --font: 'Nunito', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 3rem;
  }

  /* ── HEADER ── */
  header { text-align: center; margin-bottom: 2.5rem; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    font-size: 12px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
    padding: 5px 14px; margin-bottom: 20px;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 12px;
  }
  .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 14px 28px;
  }
  .logo-wrap img { height: 48px; width: auto; display: block; }
  .logo-arrow {
    font-size: 28px; font-weight: 900; color: var(--yellow);
    line-height: 1; flex-shrink: 0;
  }
  .subtitle  { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

  /* ── STATS ROW ── */
  .stats-row {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    max-width: 760px; margin: 0 auto 2.5rem;
  }
  .stat-box {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px 22px;
    text-align: center; flex: 1 1 100px;
  }
  .stat-icon  { font-size: 22px; margin-bottom: 4px; }
  .stat-val   { font-size: 22px; font-weight: 900; color: var(--text); }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

  /* ── GUIDE WRAP ── */
  .guide-wrap { max-width: 760px; margin: 0 auto; }

  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 1rem;
  }
  .pill { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }

  /* ── PHASE NAV ── */
  .phase-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .phase-btn {
    font-family: var(--font); font-size: 12px; font-weight: 800; padding: 6px 14px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface); color: var(--muted); cursor: pointer; transition: all .15s;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .phase-btn:hover:not(.active) { border-color: rgba(255,255,255,0.22); color: var(--text); }
  .phase-btn.active { color: #0f0f1a; border-color: transparent; }
  .pb0.active { background: var(--pink); }
  .pb1.active { background: var(--blue); }
  .pb2.active { background: var(--green); }
  .pb3.active { background: var(--yellow); }
  .pb4.active { background: var(--purple); }

  /* ── PROGRESS ── */
  .progress-bar {
    height: 4px; background: var(--surface); border-radius: 4px;
    margin-bottom: 1.5rem; overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .35s ease; }
  .pf0 { background: var(--pink); }
  .pf1 { background: var(--blue); }
  .pf2 { background: var(--green); }
  .pf3 { background: var(--yellow); }
  .pf4 { background: var(--purple); }

  /* ── PHASE TEXT ── */
  .phase-label {
    font-size: 11px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: .4rem;
  }
  .phase-title { font-size: 26px; font-weight: 900; color: var(--text); margin-bottom: .4rem; line-height: 1.2; }
  .phase-desc  { font-size: 14px; color: var(--muted); line-height: 1.65; margin-bottom: 1.5rem; font-weight: 600; }

  /* ── STEPS ── */
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; overflow: hidden; cursor: pointer; transition: border-color .15s;
  }
  .step:hover { border-color: rgba(255,255,255,0.15); }
  .step.open  { border-color: rgba(255,255,255,0.22); }

  .step-header {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 18px; user-select: none;
  }
  .step-num {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900;
    background: var(--surface); color: var(--muted); transition: all .15s;
  }
  /* Active number colors per phase */
  .gw0 .step.open .step-num { background: var(--pink);   color: #0f0f1a; }
  .gw1 .step.open .step-num { background: var(--blue);   color: #0f0f1a; }
  .gw2 .step.open .step-num { background: var(--green);  color: #0f0f1a; }
  .gw3 .step.open .step-num { background: var(--yellow); color: #0f0f1a; }
  .gw4 .step.open .step-num { background: var(--purple); color: #0f0f1a; }

  .step-name    { font-size: 14px; font-weight: 800; color: var(--text); flex: 1; }
  .step-chevron { font-size: 13px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
  .step.open .step-chevron { transform: rotate(180deg); }

  .step-tag {
    font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  }
  .step-tag.figma   { background: rgba(255,107,157,.15); color: var(--pink); }
  .step-tag.webflow { background: rgba(77,150,255,.15);  color: var(--blue); }
  .step-tag.both    { background: rgba(107,203,119,.15); color: var(--green); }

  .step-body {
    display: none; padding: 0 18px 18px;
    border-top: 1px solid var(--card-border);
  }
  .step.open .step-body { display: block; }

  /* ── CHECKLIST ── */
  .checklist { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .checklist li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: var(--muted); line-height: 1.55; font-weight: 600;
  }
  .check-box {
    width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-top: 1px;
    border: 1.5px solid rgba(255,255,255,0.15); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .check-box.checked { border-color: transparent; }
  .check-box.checked::after { content: '✓'; font-size: 11px; font-weight: 900; color: #0f0f1a; }
  .gw0 .check-box.checked { background: var(--pink); }
  .gw1 .check-box.checked { background: var(--blue); }
  .gw2 .check-box.checked { background: var(--green); }
  .gw3 .check-box.checked { background: var(--yellow); }
  .gw4 .check-box.checked { background: var(--purple); }
  .item-text.done { text-decoration: line-through; opacity: .4; }

  /* ── FOOTER NAV ── */
  .footer-nav { display: flex; gap: 10px; margin-top: 1.5rem; }
  .nav-btn {
    font-family: var(--font); font-size: 13px; font-weight: 800; padding: 10px 20px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface); color: var(--text); cursor: pointer; transition: all .15s;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .nav-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.25); }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn.primary { border-color: transparent; color: #0f0f1a; font-weight: 900; }
  .nav-btn.primary:hover:not(:disabled) { opacity: .88; }
  .nb0.primary { background: var(--pink); }
  .nb1.primary { background: var(--blue); }
  .nb2.primary { background: var(--green); }
  .nb3.primary { background: var(--yellow); }
  .nb4.primary { background: var(--purple); }
</style>
</head>

  <div class="footer-nav">
    <button class="nav-btn" id="prevBtn" onclick="changePhase(-1)">← Prev</button>
    <button class="nav-btn primary" id="nextBtn" onclick="changePhase(1)">Next →</button>
  </div>
</div>

<script>
const COLORS = ['var(--pink)','var(--blue)','var(--green)','var(--yellow)','var(--purple)'];

const phases = [
  {
    label: "Phase 1 · Before Design",
    title: "Project Setup & Discovery",
    desc: "Get the Figma file and design system properly structured before any screen design begins.",
    steps: [
      {
        name: "Set up your Figma file correctly",
        tag: "figma", tagLabel: "Figma",
        items: [
          "Create a cover page with project name, version, and date",
          "Set up pages: Cover, Design System, Wireframes, and each main page",
          "Define your frame sizes: Desktop (1440px), Tablet (768px), Mobile (375px)",
          "Enable Figma's grid layout on frames (12-column grid, 24px gutters)"
        ]
      },
      {
        name: "Build your Design System first",
        tag: "figma", tagLabel: "Figma",
        items: [
          "Define your color tokens: Primary, Secondary, Neutral, Error, Success",
          "Set up typography: Font family, sizes (H1–H6, body, caption), line heights",
          "Create base components: Button (all states), Input, Card, Navigation",
          "Use Figma Variables for colors and spacing so they sync with Webflow later"
        ]
      }
    ]
  },
  {
    label: "Phase 2 · In Figma",
    title: "Design Preparation for Webflow",
    desc: "How you build in Figma directly affects how easy Webflow development will be. Make it 'Webflow-ready.'",
    steps: [
      {
        name: "Design with Webflow's structure in mind",
        tag: "figma", tagLabel: "Figma",
        items: [
          "Think in Sections → Containers → Div Blocks (Webflow's layout model)",
          "Use Auto Layout to mimic Flexbox and CSS Grid — avoid absolute positioning",
          "Design reusable components (Nav, Footer, CTA) as Figma components",
          "Label every layer clearly — devs and Webflow users will reference them"
        ]
      },
      {
        name: "Prepare assets for export",
        tag: "figma", tagLabel: "Figma",
        items: [
          "Export logos and icons as SVG (scales perfectly, small file size)",
          "Export photos/illustrations as WebP or PNG at 2x for retina screens",
          "Ensure images have meaningful names (not 'image-1.png') before export",
          "Use Figma's 'Mark for export' feature to batch-export all assets at once"
        ]
      },
      {
        name: "Design review & handoff prep",
        tag: "figma", tagLabel: "Figma",
        items: [
          "Check spacing consistency — use the same spacing scale (4px, 8px, 16px, 24px…)",
          "Verify all text uses styles from your design system (no rogue fonts or colors)",
          "Add developer notes in Figma for animations, hover states, or interactions",
          "Share the Figma file link with 'View' access for stakeholder approval"
        ]
      }
    ]
  },
  {
    label: "Phase 3 · Webflow Setup",
    title: "Configuring Your Webflow Project",
    desc: "Starting Webflow with the right settings prevents hours of cleanup. Do these before building any pages.",
    steps: [
      {
        name: "Create and configure the Webflow project",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Create a new project and choose the correct site template (blank or starter)",
          "Set the project name to match the client/brand name",
          "Go to Project Settings → SEO and fill in the default meta title and description",
          "Connect a custom domain if available, or note the .webflow.io staging URL"
        ]
      },
      {
        name: "Set up Global Styles in Webflow",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Open Style Guide and set Body: font, base size (16px), and line height",
          "Create Heading styles (H1–H4) matching your Figma typography exactly",
          "Add your color swatches under 'Swatches' in the Styles panel",
          "Set global spacing and max-width for your container (usually 1200–1440px)"
        ]
      },
      {
        name: "Upload assets to Webflow",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Upload all exported images to the Asset Manager (organize in folders if possible)",
          "Upload SVG icons and logos — test they display correctly in the browser",
          "Add your custom fonts via Google Fonts integration or upload .woff2 files",
          "Add your favicon (32×32 PNG) in Project Settings → Favicon"
        ]
      }
    ]
  },
  {
    label: "Phase 4 · Development",
    title: "Building Pages in Webflow",
    desc: "Follow this build order to stay efficient and avoid redoing work.",
    steps: [
      {
        name: "Build your Symbols / Components first",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Build the Navbar first — it appears on every page",
          "Build the Footer next — same reason",
          "Create any reusable sections (CTA banners, testimonials, feature rows)",
          "Use Webflow Symbols so changes update everywhere automatically"
        ]
      },
      {
        name: "Build pages one at a time",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Start with the Homepage — it's the most complex and sets the pattern",
          "Refer to Figma Inspect for exact padding, margin, and font values",
          "Use Webflow's built-in Breakpoints to style Desktop → Tablet → Mobile",
          "Always check the live preview after each section is built"
        ]
      },
      {
        name: "Add interactions and animations",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Add hover states to buttons and links via Interactions panel",
          "Use scroll-triggered animations sparingly (fade in, slide up) for sections",
          "Refer to developer notes in Figma for any custom animation behavior",
          "Test all interactions on both desktop and mobile before sign-off"
        ]
      }
    ]
  },
  {
    label: "Phase 5 · Pre-Launch",
    title: "Quality Assurance & Launch",
    desc: "Never skip QA. Run through this full checklist before going live.",
    steps: [
      {
        name: "Cross-browser & device testing",
        tag: "both", tagLabel: "Both",
        items: [
          "Test in Chrome, Safari, Firefox, and Edge",
          "Test on a real iPhone and Android phone if possible",
          "Check tablet layout (768px) — often the most neglected breakpoint",
          "Test all forms: check submissions go to the right email or CMS"
        ]
      },
      {
        name: "SEO and performance check",
        tag: "webflow", tagLabel: "Webflow",
        items: [
          "Add unique meta titles and descriptions to every page",
          "Add ALT text to all meaningful images",
          "Run a Lighthouse audit in Chrome DevTools — aim for 90+ Performance",
          "Check that all pages have an H1 tag and logical heading hierarchy"
        ]
      },
      {
        name: "Final checks before going live",
        tag: "both", tagLabel: "Both",
        items: [
          "Remove all placeholder text (Lorem Ipsum) and test images",
          "Check all links — no broken links or 404 pages",
          "Confirm the custom domain is properly connected in Project Settings",
          "Do a final client review walkthrough and get written approval"
        ]
      }
    ]
  }
];

let currentPhase = 0;

function render() {
  const phase = phases[currentPhase];
  const ci = currentPhase;

  // Progress
  const fill = document.getElementById('progressFill');
  fill.style.width = ((ci + 1) / phases.length * 100) + '%';
  fill.className = 'progress-fill pf' + ci;

  // Pill dot color
  document.getElementById('pillDot').style.background = COLORS[ci];

  // Phase nav
  document.getElementById('phaseNav').innerHTML = phases.map((p, i) =>
    `<button class="phase-btn pb${i}${i === ci ? ' active' : ''}" onclick="setPhase(${i})">Phase ${i + 1}</button>`
  ).join('');

  document.getElementById('phaseLabel').textContent = phase.label;
  document.getElementById('phaseTitle').textContent = phase.title;
  document.getElementById('phaseDesc').textContent  = phase.desc;

  // Guide wrap color class
  document.getElementById('guideWrap').className = 'guide-wrap gw' + ci;

  // Steps
  document.getElementById('stepsContainer').innerHTML = phase.steps.map((step, si) => `
    <div class="step" id="step-${si}">
      <div class="step-header" onclick="toggleStep(${si})">
        <div class="step-num">${si + 1}</div>
        <div class="step-name">${step.name}</div>
        <span class="step-tag ${step.tag}">${step.tagLabel}</span>
        <span class="step-chevron">▾</span>
      </div>
      <div class="step-body">
        <ul class="checklist">
          ${step.items.map((item, ii) => `
            <li>
              <div class="check-box" id="cb-${si}-${ii}" onclick="toggleCheck(event,${si},${ii})"></div>
              <span class="item-text" id="it-${si}-${ii}">${item}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  // Buttons
  document.getElementById('prevBtn').disabled = ci === 0;
  const nb = document.getElementById('nextBtn');
  nb.textContent = ci === phases.length - 1 ? '✓ Complete' : 'Next →';
  nb.disabled = ci === phases.length - 1;
  nb.className = `nav-btn primary nb${ci}`;
}

function toggleStep(i) {
  document.getElementById('step-' + i).classList.toggle('open');
}
function toggleCheck(e, si, ii) {
  e.stopPropagation();
  document.getElementById('cb-' + si + '-' + ii).classList.toggle('checked');
  document.getElementById('it-' + si + '-' + ii).classList.toggle('done');
}
function setPhase(i) { currentPhase = i; render(); }
function changePhase(dir) {
  currentPhase = Math.max(0, Math.min(phases.length - 1, currentPhase + dir));
  render();
}

render();
</script>
</body>
</html>
